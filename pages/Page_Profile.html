<div style="padding: 20px; font-family:'Kanit', sans-serif; max-width: 900px; margin: 0 auto;">
  <h2 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top:0;">
    <i class="fas fa-user-circle" style="color:#3498db;"></i> โปรไฟล์และการตั้งค่าบัญชี
  </h2>

  <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
    
    <!-- 🌟 คอลัมน์ซ้าย: ข้อมูลส่วนตัว & แจ้งเตือน LINE -->
    <div style="flex: 1; min-width: 300px;">
      
      <!-- ข้อมูลผู้ใช้ -->
      <div style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;">
        <h4 style="margin-top: 0; color: #2c3e50;"><i class="fas fa-id-card"></i> ข้อมูลผู้ใช้งาน</h4>
        <div style="margin-bottom: 10px; font-size: 0.95rem;">
          <span style="color: #7f8c8d;">ชื่อ-สกุล:</span> <strong id="profile-name" style="color: #2c3e50;">-</strong>
        </div>
        <div style="margin-bottom: 10px; font-size: 0.95rem;">
          <span style="color: #7f8c8d;">อีเมลบัญชี:</span> <strong id="profile-email" style="color: #2980b9;">-</strong>
        </div>
        <div style="margin-bottom: 10px; font-size: 0.95rem;">
          <span style="color: #7f8c8d;">สิทธิ์การใช้งาน:</span> <strong id="profile-role" style="color: #8e44ad;">-</strong>
        </div>
        <div style="font-size: 0.95rem;">
          <span style="color: #7f8c8d;">สถานะ:</span> <span id="profile-status" style="background:#27ae60; color:white; padding:2px 8px; border-radius:12px; font-size:0.8rem;">-</span>
        </div>
      </div>

      <!-- ส่วนเชื่อมต่อ LINE OA -->
      <div style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        <h4 style="margin-top: 0; color: #00b900;"><i class="fab fa-line"></i> การแจ้งเตือนผ่าน LINE OA</h4>
        <div id="profile-line-status" style="background: #fdf2e9; padding: 15px; border-radius: 6px; text-align: center;">
          <i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบข้อมูล...
        </div>
      </div>

    </div>

    <!-- 🌟 คอลัมน์ขวา: จัดการลายเซ็นดิจิทัล -->
    <div style="flex: 1.5; min-width: 350px;">
      <div style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        <h4 style="margin-top: 0; color: #2c3e50; border-bottom: 1px dashed #ccc; padding-bottom: 10px;"><i class="fas fa-signature"></i> ลายเซ็นดิจิทัลของฉัน</h4>
        
        <!-- ลายเซ็นปัจจุบัน -->
        <div style="margin-bottom: 20px;">
          <label style="color:#7f8c8d; font-size:0.9rem; font-weight:bold;">ลายเซ็นที่ใช้งานอยู่:</label>
          <div style="background: #f9fbfc; border: 1px solid #e0e6ed; border-radius: 4px; padding: 10px; text-align: center; min-height: 80px; display: flex; justify-content: center; align-items: center;">
            <img id="current-signature-img" src="" style="max-height: 80px; max-width: 100%; display: none; object-fit: contain;">
            <span id="no-signature-text" style="color: #e74c3c; font-size: 0.9rem;"><i class="fas fa-times-circle"></i> ยังไม่มีการบันทึกลายเซ็นในระบบ</span>
          </div>
        </div>

        <!-- แท็บเลือกวิธีใส่ลายเซ็น -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <button id="btn-tab-draw" onclick="switchSigTab('draw')" style="flex: 1; background: #2980b9; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-weight: bold;"><i class="fas fa-pen"></i> วาดลายเซ็น</button>
          <button id="btn-tab-upload" onclick="switchSigTab('upload')" style="flex: 1; background: #ecf0f1; color: #7f8c8d; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-weight: bold;"><i class="fas fa-upload"></i> อัปโหลดรูปภาพ</button>
        </div>

        <!-- พื้นที่วาดลายเซ็น -->
        <div id="sig-area-draw" style="display: block; text-align: center;">
          <canvas id="signature-pad" width="400" height="150" style="background: #f4f6f8; border: 2px dashed #bdc3c7; border-radius: 6px; cursor: crosshair; touch-action: none; max-width: 100%;"></canvas>
          <div style="margin-top: 10px; text-align: right;">
            <button onclick="clearSignature()" style="background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-size: 0.85rem;"><i class="fas fa-eraser"></i> ล้างกระดาน</button>
          </div>
        </div>

        <!-- พื้นที่อัปโหลดรูปภาพ -->
        <div id="sig-area-upload" style="display: none; text-align: center;">
          <div style="background: #f4f6f8; border: 2px dashed #bdc3c7; border-radius: 6px; padding: 20px;">
            <input type="file" id="sig-file-input" accept="image/png, image/jpeg" style="display: none;" onchange="handleSignatureUpload(event)">
            <label for="sig-file-input" style="background: #3498db; color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.95rem; font-weight: bold; display: inline-block;">
              <i class="fas fa-image"></i> เลือกไฟล์รูปภาพ (PNG/JPG)
            </label>
            <p style="font-size: 0.8rem; color: #7f8c8d; margin-top: 10px;">* แนะนำให้ใช้ภาพพื้นหลังใส (PNG)</p>
            <img id="upload-preview" src="" style="max-height: 80px; max-width: 100%; display: none; margin: 15px auto 0 auto; border: 1px solid #ccc; padding: 5px; background: white;">
          </div>
        </div>

        <!-- ปุ่มบันทึกลายเซ็น -->
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; text-align: center;">
          <button onclick="saveSignature()" id="btn-save-signature" style="background: #27ae60; color: white; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-weight: bold; font-size: 1rem; width: 100%; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);">
            <i class="fas fa-save"></i> บันทึกลายเซ็นเพื่อใช้งาน
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
