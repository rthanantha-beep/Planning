<!-- ========================================== -->
<!-- 🌟 หน้า: รายงานของฉัน (My Reports) 🌟 -->
<!-- ========================================== -->
<div id="page-myreports" class="page-section" style="display: none;">
  
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
    <h2 style="color: #2980b9; margin: 0;"><i class="fas fa-file-signature"></i> รายงานผลการดำเนินงานของคุณ</h2>
    
    <!-- 🌟 ส่วนเครื่องมือ: ตัวกรองปี และ ลิงก์ Template 🌟 -->
    <div style="display:flex; gap: 15px; align-items: center; background: #f4f6f8; padding: 10px 15px; border-radius: 8px; border: 1px solid #e0e0e0;">
      
      <!-- 1. ตัวกรองปีงบประมาณ -->
      <div style="display:flex; align-items: center; gap: 5px;">
        <label style="font-weight: bold; color: #555; margin-bottom: 0;"><i class="fas fa-filter"></i> ปีงบประมาณ:</label>
        <select id="myreports-year-filter" onchange="loadMyReports()" style="padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Kanit'; cursor: pointer;">
          <option value="all">ทั้งหมด</option>
          <option value="69">2569</option>
          <option value="68">2568</option>
        </select>
      </div>

      <div style="border-left: 2px solid #ccc; height: 30px;"></div> <!-- เส้นคั่น -->

      <!-- 2. กล่องแสดงลิงก์ Template -->
      <div style="display:flex; align-items: center; gap: 5px;">
        <label style="font-weight: bold; color: #27ae60; margin-bottom: 0;"><i class="fas fa-file-word"></i> Template รายงาน:</label>
        <input type="text" id="display-template-report" readonly value="กำลังโหลด..." style="width: 250px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Kanit'; background: #fff; color: #555; font-size: 0.9rem;">
        <a id="btn-open-report-template" href="#" target="_blank" style="background:#27ae60; color:white; padding:7px 12px; border-radius:4px; text-decoration:none; font-family:'Kanit'; font-size: 0.9rem; display: none;">
          <i class="fas fa-external-link-alt"></i> เปิด
        </a>
      </div>

    </div>
  </div>

  <div class="card table-responsive">
    <table class="table">
      <thead>
        <tr style="background-color: #ebf5fb;">
          <th>รหัสโครงการ</th>
          <th>ชื่อโครงการ (ที่ได้รับอนุมัติแล้ว)</th>
          <th style="text-align: center;">สถานะการจัดงาน</th>
          <th style="text-align: center;">สถานะรายงาน</th>
          <th style="text-align: center;">จัดการรายงาน</th>
        </tr>
      </thead>
      <tbody id="my-reports-tbody">
        <!-- ข้อมูลรายงานจะแสดงตรงนี้ -->
      </tbody>
    </table>
  </div>
</div>
